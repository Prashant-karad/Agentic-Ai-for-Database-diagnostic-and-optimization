[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbagent"
version = "0.1.0"
description = "Agentic AI for Database Diagnostics and Performance Optimization"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0",
    "openai>=1.40,<3",
    "langgraph>=0.2",

]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]